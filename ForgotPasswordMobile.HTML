<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 

    @font-face {
        font-family: 'Sansa';
        src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Sansa.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'Century Gothic';
        src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/centurygothic.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
    }

    @font-face {
        font-family: 'Karmina';
        src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Karmina%20Regular.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
    }

    body, html {
        font-family: 'Century Gothic', 'Sansa', 'Karmina';
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center; /* Center body content */
        align-items: center;     /* Vertically align content */
        background-image: url(https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true);
        color: black;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
    }

    #layer {
        position: relative;
        width: 100%;
        max-width: 450px; /* Ensure a fixed max-width for the content */
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.8); /* Optional: Background for layer */
        border-radius: 10px;
    }

    input {
        width: 100%; /* Make sure inputs fill the container */
        max-width: 400px; /* Limit width to fit within the container */
        padding: 10px;
        margin: 10px 0;
        border-radius: 25px;
        border: 1px solid black;
        font-weight: bold;
        text-align: center;
    }

    #logo {
        height: 50px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
        margin-bottom: 20px;
    }

    button {
        width: 100%;
        max-width: 400px; /* Keep buttons the same width as inputs */
        padding: 10px;
        border-radius: 25px;
        border: none;
        font-weight: bold;
        background-color: rgb(209, 0, 52);
        color: white;
        cursor: pointer;
        margin-top: 10px;
    }

    button:disabled {
        background-color: #ccc;
    }

    a {
        display: none;
    }

    /* Hide elements you don't need */
    #cancel {
        display: none;
    }

    #continue {
        display: none;
    }

    li.no-marker::marker {
        content: none;
    }

    marker {
        display: none;
    }

    li {
        display: block;
    }

    @media only screen and (max-height: 400px) {
        #logo {
            display: none;
        }
    }
    </style>
</head>
<body>
    <div id="layer">
        <div id="logo"></div>
        <div id="api">
        </div>
    </div>
</body>
</html>
