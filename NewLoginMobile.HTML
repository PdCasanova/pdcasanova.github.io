<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style>
        @font-face {
            font-family: 'Sansa';
            src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/Sansa.ttf") format("truetype");
        }

        @font-face {
            font-family: 'Century Gothic';
            src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/centurygothic.ttf") format("truetype");
        }

        @font-face {
            font-family: 'Karmina';
            src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/Karmina%20Regular.otf") format("opentype");
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Sansa', 'Century Gothic', 'Karmina', sans-serif;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            min-height: 100vh;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 1;
            position: relative;
        }

        #logo {
            height: 80px;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        label.visually-hidden {
            position: absolute;
            left: -10000px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 25px;
            font-weight: bold;
        }

        ::placeholder {
            color: rgb(209, 0, 52);
            opacity: 0.7;
        }

        input:focus {
            outline: #DCDCDC auto 5px;
        }

        #next {
            padding: 10px;
            width: 95%;
            color: white;
            font-weight: bold;
            background-color: rgb(209, 0, 52);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #next:hover {
            background-color: rgb(180, 0, 45);
        }

        #forgotPassword {
            display: block;
            margin-top: 10px;
            color: rgb(209, 0, 52);
            text-decoration: none;
            font-weight: bold;
        }

        #forgotPassword:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 20px;
            }
            input, #next {
                width: 95%;
            }
            #logo {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="login-container">
        <div id="logo"></div>
        <h1>Login</h1>
        <label for="username" class="visually-hidden">Username</label>
        <input type="text" id="username" placeholder="Username" required>

        <label for="password" class="visually-hidden">Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <button id="next">Login</button>
    </div>
</body>
</html>
