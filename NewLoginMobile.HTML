<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 

	@font-face {
	    font-family: 'Sansa';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Sansa.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Century Gothic';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/centurygothic.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Karmina';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Karmina%20Regular.otf") format("opentype");
	    font-weight: normal;
	    font-style: normal;
	}


        /* Fallback fonts (Remove if custom fonts are hosted correctly) */
        body, html {
            font-family: 'Century Gothic','Sansa','Karmina';
        }

        h1 {
            font-size: 20px;
        }

	body {
	    max-width: 100%;
	    margin: auto;
	    text-align: center;
	    background-image: url(https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true);
	    color: black;
	    height: fit-content;
	    height: 100%;
	    background-position: center;
	    background-repeat: no-repeat;
	    background-size: cover;
	}

        label {
		display:none;
	      }

        #layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            height: 50px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            margin-bottom: 20px;
        }

       

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid black;
            font-weight: bold;
            text-align: center;
        }

               #api {
            width: 300px;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #forgotPassword {
	    margin-top: 20px;
	    text-align: center;
	    font-weight: bold;
	    color: rgb(209, 0, 52);
	}

        #next {
            padding: 10px;
            width: 95%;
            color: white;
            font-weight: bold;
            background-color: rgb(209, 0, 52);
            margin-top: 10px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
        }

	#back {
	    align-self: flex-start; /* Alinha à esquerda dentro do #api */
	    margin-bottom: 10px;
	    padding: 10px 20px;
	    color: rgb(209, 0, 52);
	    font-weight: bold;
	    background-color: white;
	    border: 2px solid rgb(209, 0, 52);
	    border-radius: 25px;
	    cursor: pointer;
	}



        @media only screen and (max-height: 400px) {
            #logo {
                display: none;
            }
        }

	.divider h2 {
	  display:none;
	}
	.create {
	 display:none;
	}

	.entry{
	display:grid;
	}

	.entry-item{
	display:grid;
	}

	.password-label{
	order:1;
	}

    </style>
</head>
<body>
    <div id="layer">
        <div id="logo"></div>
        <div id="api">
        </div>
    </div>
	<script>
		  document.addEventListener('DOMContentLoaded', function () {
		    // Verifica se a div #api existe
		    var apiDiv = document.getElementById('api');
		    if (apiDiv) {
		      // Cria o botão "Back"
		      var backBtn = document.createElement('button');
		      backBtn.id = 'back';
		      backBtn.innerText = 'Back';
		      backBtn.onclick = function () {
		        window.history.back();
		      };
		
		      // Estiliza o botão
		      backBtn.style.padding = '10px 20px';
		      backBtn.style.marginBottom = '10px';
		      backBtn.style.color = 'rgb(209, 0, 52)';
		      backBtn.style.fontWeight = 'bold';
		      backBtn.style.backgroundColor = 'white';
		      backBtn.style.border = '2px solid rgb(209, 0, 52)';
		      backBtn.style.borderRadius = '25px';
		      backBtn.style.cursor = 'pointer';
		      backBtn.style.alignSelf = 'flex-start';
		
		      // Insere o botão no início da div #api
		      apiDiv.insertBefore(backBtn, apiDiv.firstChild);
		    }
		  });
	</script>

</body>
</html>
