<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 

	@font-face {
	    font-family: 'Sansa';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Sansa.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Century Gothic';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/centurygothic.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Karmina';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Karmina%20Regular.otf") format("opentype");
	    font-weight: normal;
	    font-style: normal;
	}


        /* Fallback fonts (Remove if custom fonts are hosted correctly) */
        body, html {
            font-family: 'Century Gothic','Sansa','Karmina';
        }

        h1 {
            font-size: 20px;
        }

	body {
	    max-width: 100%;
	    margin: auto;
	    text-align: center;
	    background-image: url(https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true);
	    color: black;
	    height: fit-content;
	    height: 100%;
	    background-position: center;
	    background-repeat: no-repeat;
	    background-size: cover;
	}

        label {
		display:none;
	      }

        #layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            height: 50px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            margin-bottom: 20px;
        }

       

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid black;
            font-weight: bold;
            text-align: center;
        }

               #api {
            width: 300px;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #forgotPassword {
	    margin-top: 20px;
	    text-align: center;
	    font-weight: bold;
	    color: rgb(209, 0, 52);
	}

        #next {
            padding: 10px;
            width: 95%;
            color: white;
            font-weight: bold;
            background-color: rgb(209, 0, 52);
            margin-top: 10px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
        }

        @media only screen and (max-height: 400px) {
            #logo {
                display: none;
            }
        }

	.divider h2 {
	  display:none;
	}
	.create {
	 display:none;
	}

	.entry{
	display:grid;
	}

	.entry-item{
	display:grid;
	}

	.password-label{
	order:1;
	}

    </style>
</head>
<body>
    <div id="layer">
        <div id="logo"></div>
        <div id="api">
        </div>
    </div>
	<script>
		function goBack() {
		  if (document.referrer && document.referrer !== location.href) {
		    window.history.back();
		  } else {
		    window.location.href = "_CLOSE_THIS_THING";
		  }
		}
		
		function insertBackButton() {
		  const apiContainer = document.getElementById('api');
		
		  // Only proceed if the container exists and no back button yet
		  if (apiContainer && !document.getElementById('back')) {
		    const backBtn = document.createElement('button');
		    backBtn.id = 'back';
		    backBtn.type = 'button';
		    backBtn.onclick = goBack;
		
		    // SVG markup for the back arrow
		    const svg = `
		      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#209052" height="30px" width="30px" version="1.1" id="Capa_1" viewBox="0 0 59.414 59.414" xml:space="preserve">
		        <polygon points="45.268,1.414 43.854,0 14.146,29.707 43.854,59.414 45.268,58 16.975,29.707"/>
		      </svg>
		    `;
		    backBtn.innerHTML = svg; // Insert the SVG as the button content
		
		    // Styling similar to the original button, adjust as needed
		    Object.assign(backBtn.style, {
		      padding: '10px',
		      width: '50px', // Adjust size to fit the SVG better
		      marginBottom: '20px',
		      backgroundColor: 'white',
		      border: '2px solid rgb(209, 0, 52)',
		      borderRadius: '25px',
		      cursor: 'pointer',
		      display: 'flex',
		      justifyContent: 'center',  // Center the SVG inside the button
		      alignItems: 'center',      // Center the SVG inside the button
		      height: '50px',            // Adjust height to match width and create a square button
		    });
		
		    // Insert at the beginning of #api container
		    apiContainer.insertBefore(backBtn, apiContainer.firstChild);
		
		    console.log('Version 0.1');
		
		    clearInterval(waitForApiContainer);
		  }
		}
		
		// Check every 300ms until #api container is available
		const waitForApiContainer = setInterval(insertBackButton, 300);
	</script>
</body>
</html>
