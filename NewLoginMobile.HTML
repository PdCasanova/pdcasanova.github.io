<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 

	@font-face {
	    font-family: 'Sansa';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Sansa.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Century Gothic';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/centurygothic.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Karmina';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Karmina%20Regular.otf") format("opentype");
	    font-weight: normal;
	    font-style: normal;
	}


        /* Fallback fonts (Remove if custom fonts are hosted correctly) */
        body, html {
            font-family: 'Century Gothic','Sansa','Karmina';
        }

        h1 {
            font-size: 20px;
        }

	body {
	    max-width: 100%;
	    margin: auto;
	    text-align: center;
	    background-image: url(https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true);
	    color: black;
	    height: fit-content;
	    height: 100%;
	    background-position: center;
	    background-repeat: no-repeat;
	    background-size: cover;
	}

        label {
		display:none;
	      }

        #layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            height: 50px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            margin-bottom: 20px;
        }

       

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid black;
            font-weight: bold;
            text-align: center;
        }

               #api {
            width: 300px;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #forgotPassword {
	    margin-top: 20px;
	    text-align: center;
	    font-weight: bold;
	    color: rgb(209, 0, 52);
	}

        #next {
            padding: 10px;
            width: 95%;
            color: white;
            font-weight: bold;
            background-color: rgb(209, 0, 52);
            margin-top: 10px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
        }

        @media only screen and (max-height: 400px) {
            #logo {
                display: none;
            }
        }

	.divider h2 {
	  display:none;
	}
	.create {
	 display:none;
	}

	.entry{
	display:grid;
	}

	.entry-item{
	display:grid;
	}

	.password-label{
	order:1;
	}

    </style>
</head>
<body>
    <div id="layer">
        <div id="logo"></div>
        <div id="api">
        </div>
    </div>
	<script src="https://cdn.jsdelivr.net/gh/PdCasanova/pdcasanova.github.io/custom-back-button.js?v=3.0"></script>
	<script> 
		(function setupPasswordToggle() {
		    const passwordInput = document.getElementById("password");
		
		    if (!passwordInput) return;
		
		    // Create the button
		    const toggleBtn = document.createElement("button");
		    toggleBtn.type = "button";
		    toggleBtn.id = "togglePassword";
		    toggleBtn.setAttribute("aria-label", "Show password");
		    toggleBtn.style.background = "none";
		    toggleBtn.style.border = "none";
		    toggleBtn.style.cursor = "pointer";
		    toggleBtn.style.position = "absolute";
		    toggleBtn.style.right = "10px";
		    toggleBtn.style.top = "50%";
		    toggleBtn.style.transform = "translateY(-50%)";
		    toggleBtn.style.padding = "0";
		
		    // Inject SVG icon into the button
		    toggleBtn.innerHTML = `
		        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="#000000" width="20" height="20" viewBox="0 0 442.04 442.04">
		            <path d="M221.02,341.304c..."/> <!-- Paste full path(s) here -->
		        </svg>
		    `;
		
		    // Wrap the password input to allow relative positioning
		    const wrapper = document.createElement("div");
		    wrapper.style.position = "relative";
		    passwordInput.parentNode.insertBefore(wrapper, passwordInput);
		    wrapper.appendChild(passwordInput);
		    wrapper.appendChild(toggleBtn);
		
		    // Toggle password visibility
		    toggleBtn.addEventListener("click", function () {
		        const isHidden = passwordInput.type === "password";
		        passwordInput.type = isHidden ? "text" : "password";
		
		        // Optional: visual feedback
		        const eyeIcon = toggleBtn.querySelector("#eyeIcon");
		        if (eyeIcon) {
		            eyeIcon.style.fill = isHidden ? "#0078D4" : "#000";
		        }
		    });
		})();
	</script>
</body>
</html>
