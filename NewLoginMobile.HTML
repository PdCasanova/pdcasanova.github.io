<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style>
        @font-face {
            font-family: 'Sansa';
            src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/Sansa.ttf") format("truetype");
        }

        @font-face {
            font-family: 'Century Gothic';
            src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/centurygothic.ttf") format("truetype");
        }

        @font-face {
            font-family: 'Karmina';
            src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/Karmina%20Regular.otf");
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Sansa', 'Century Gothic', 'Karmina';
            text-align: center;
            background: url("https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true") center/cover no-repeat;
            color: black;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            height: 50px;
            background: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true") center/contain no-repeat;
            width: 150px;
            margin-bottom: 20px;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 25px;
            font-weight: bold;
        }

        input:focus {
            outline: #DCDCDC auto 5px;
        }

        #next {
            width: 85%;
            padding: 10px;
            background: rgb(209, 0, 52);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }

        #forgotPassword {
            margin-top: 10px;
            color: rgb(209, 0, 52);
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-height: 400px) {
            #logo {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="logo"></div>
        <div class="form-container">
            <input type="text" placeholder="Username" required>
            <div class="password-label">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Password" required>
                <a id="forgotPassword" href="#">Forgot Password?</a>
            </div>
            <button id="next">Login</button>
        </div>
    </div>
</body>
</html>
