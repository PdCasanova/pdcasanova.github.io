<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 
        /* Fallback fonts (Remove if custom fonts are hosted correctly) */
        body, html {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 20px;
        }

        body {
            max-width: 100%;
            margin: auto;
            text-align: center;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true");
            color: black;
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        #layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            height: 50px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            margin-bottom: 20px;
        }

        #api {
            transform: translateY(50%);
            margin-top: 70px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid black;
            font-weight: bold;
            text-align: center;
        }

        #next {
            padding: 10px;
            width: 100%;
            color: white;
            font-weight: bold;
            background-color: rgb(209, 0, 52);
            margin-top: 10px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
        }

        /* Align the Forgot Password link properly under the Login button */
        #forgotPassword {
            display: block; /* Ensure it’s displayed as a block element */
            background-color: transparent;
            color: rgb(209, 0, 52);
            font-weight: normal;
            border: none;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px; /* Space between Login and Forgot Password link */
        }

        @media only screen and (max-height: 400px) {
            #logo {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="layer">
        <div id="logo"></div>
        <div id="api">
            <h1>Login</h1>
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <button id="next">Login</button>
            <!-- Forgot Password link under the Login button -->
            <div id="forgotPassword">
                <a href="#">Forgot your password?</a> <!-- Assuming the API takes care of this link -->
            </div>
        </div>
    </div>
</body>
</html>
