<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 
        @font-face {
            font-family: 'Sansa';
            src: url("https://github.com/DBACarvalho/WebSite/raw/main/Sansa.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Century Gothic';
            src: url("https://github.com/DBACarvalho/WebSite/raw/main/centurygothic.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Karmina';
            src: url("https://github.com/DBACarvalho/WebSite/raw/main/Karmina%20Regular.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        body, html {
            height: 100%;
            margin: 0;
            text-align: center;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            overflow: hidden;
            font-family: "Arial", "Helvetica", sans-serif;
        }

        h1 {
            font-size: 20px;
        }

        #layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #logo {
            height: 50px;
            position: relative;
            background-position: right;
            background-repeat: no-repeat;
            background-size: contain;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            margin: 20px auto;
        }

        #login-form {
            max-width: 300px;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            margin: auto;
            transform: translateY(30%);
        }

        label {
            display: none;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 25px;
            font-weight: bold;
        }

        input::placeholder {
            color: rgb(209, 0, 52);
        }

        input:focus {
            outline: #DCDCDC auto 5px;
        }

        #next {
            width: 95%;
            padding: 10px;
            color: white;
            font-weight: bold;
            font-family: 'Sansa', 'Century Gothic', 'Karmina', sans-serif;
            background-color: rgb(209, 0, 52);
            margin-top: 10px;
            border-radius: 25px;
            border: 1px solid black;
            cursor: pointer;
        }

        #forgotPassword {
            display: block;
            margin-top: 10px;
            color: rgb(209, 0, 52);
            font-weight: bold;
            font-family: 'Sansa', 'Century Gothic', 'Karmina', sans-serif;
            text-decoration: none;
            cursor: pointer;
        }

        #forgotPassword:hover {
            text-decoration: underline;
        }

        .error {
            background-color: rgb(230, 15, 15);
            color: white;
            padding: 5px;
            border-radius: 5px;
            margin: 10px 0;
        }

        @media only screen and (max-height: 400px) {
            #logo {
                display: none;
            }
        }
    </style>
</head>
<body> 
    <div id="layer">
        <div id="logo"></div>
        <div id="login-form">
            <h1>Login</h1>
            <input type="text" placeholder="Email" id="email">
            <input type="password" placeholder="Password" id="password">
            <button id="next">Login</button>
            <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>
    </div>
</body>
</html>
