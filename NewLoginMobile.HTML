<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 

	@font-face {
	    font-family: 'Sansa';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Sansa.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Century Gothic';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/centurygothic.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Karmina';
	    src: url("https://raw.githubusercontent.com/DBACarvalho/WebSite/main/Karmina%20Regular.otf") format("opentype");
	    font-weight: normal;
	    font-style: normal;
	}


        /* Fallback fonts (Remove if custom fonts are hosted correctly) */
        body, html {
            font-family: 'Century Gothic','Sansa','Karmina';
        }

        h1 {
            font-size: 20px;
        }

	body {
	    max-width: 100%;
	    margin: auto;
	    text-align: center;
	    background-image: url(https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true);
	    color: black;
	    height: fit-content;
	    height: 100%;
	    background-position: center;
	    background-repeat: no-repeat;
	    background-size: cover;
	}

        label {
		display:none;
	      }

        #layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            height: 50px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            margin-bottom: 20px;
        }

       

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid black;
            font-weight: bold;
            text-align: center;
        }

               #api {
            width: 300px;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #forgotPassword {
	    margin-top: 20px;
	    text-align: center;
	    font-weight: bold;
	    color: rgb(209, 0, 52);
	}

        #next {
            padding: 10px;
            width: 95%;
            color: white;
            font-weight: bold;
            background-color: rgb(209, 0, 52);
            margin-top: 10px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
        }

        @media only screen and (max-height: 400px) {
            #logo {
                display: none;
            }
        }

	.divider h2 {
	  display:none;
	}
	.create {
	 display:none;
	}

	.entry{
	display:grid;
	}

	.entry-item{
	display:grid;
	}

	.password-label{
	order:1;
	}

    </style>
</head>
<body>
    <div id="layer">
        <div id="logo"></div>
        <div id="api">
        </div>
    </div>
	<script>
/**
 * Handles navigation for custom back button logic.
 * Navigates back if there's a valid referrer, otherwise triggers a fallback event.
 */
function goBack() {
  if (document.referrer && document.referrer !== location.href) {
    window.history.back();
  } else {
    // Trigger fallback event (e.g., Outsystems)
    window.location.href = "_CLOSE_THIS_THING";
  }
}

/**
 * Injects a show/hide password toggle button with a clear eye icon.
 */
function insertPasswordToggle() {
  const passwordInput = document.getElementById("password");

  if (passwordInput && !document.getElementById("togglePassword")) {
    const wrapper = document.createElement("div");
    wrapper.style.display = "flex";
    wrapper.style.alignItems = "center";
    wrapper.style.position = "relative";
    wrapper.style.width = "100%";

    passwordInput.parentNode.insertBefore(wrapper, passwordInput);
    wrapper.appendChild(passwordInput);

    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.id = "togglePassword";
    toggleBtn.setAttribute("aria-label", "Toggle password visibility");

    Object.assign(toggleBtn.style, {
      background: "none",
      border: "none",
      cursor: "pointer",
      padding: "0",
      marginLeft: "-2em",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      height: "100%"
    });

    toggleBtn.innerHTML = `
      <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" fill="none" viewBox="0 0 24 24" stroke="#000" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.522 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7s-8.268-2.943-9.542-7z"/>
      </svg>
    `;

    wrapper.appendChild(toggleBtn);

    toggleBtn.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";

      const eyeIcon = toggleBtn.querySelector("#eyeIcon");
      if (eyeIcon) {
        eyeIcon.setAttribute("stroke", isHidden ? "#0078D4" : "#000");
      }
    });
  }
}

/**
 * Injects the custom back icon before the layer container and triggers password toggle setup.
 */
function insertBackIcon() {
  const apiContainer = document.getElementById("api");
  const container = document.getElementById("container");

  if (container && !document.getElementById("backIcon")) {
    const backIcon = document.createElement("div");
    backIcon.id = "backIcon";
    backIcon.onclick = goBack;

    backIcon.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" fill="#333" height="20px" width="20px" viewBox="0 0 59.414 59.414">
        <polygon points="45.268,1.414 43.854,0 14.146,29.707 43.854,59.414 45.268,58 16.975,29.707"/>
      </svg>
    `;

    backIcon.style.position = "absolute";
    backIcon.style.top = "10px";
    backIcon.style.left = "10px";
    backIcon.style.cursor = "pointer";
    backIcon.style.zIndex = "999";

    document.body.appendChild(backIcon);

    // Inject password toggle (after DOM settles)
    insertPasswordToggle();

    // Cleanup
    if (waitForApiContainer) clearInterval(waitForApiContainer);
    if (observerInstance) {
      observerInstance.disconnect();
      console.log("🔌 Observer disconnected");
    }
  }
}

// Polling fallback
let waitForApiContainer = setInterval(insertBackIcon, 300);

// Observer for DOM changes
let observerInstance = null;

document.addEventListener("DOMContentLoaded", () => {
  const tryAttachObserver = () => {
    const container = document.getElementById("container");

    if (container) {
      observerInstance = new MutationObserver(() => {
        insertBackIcon();
      });

      observerInstance.observe(container, {
        childList: true,
        subtree: true
      });

      console.log("👁️ MutationObserver attached - version 0.1");
    } else {
      setTimeout(tryAttachObserver, 200);
    }
  };

  tryAttachObserver();
});

	</script>
</body>
</html>
