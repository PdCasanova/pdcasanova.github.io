<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Puratos Login Page</title>
    <style> 

	@font-face {
	    font-family: 'Sansa';
	    src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/Sansa.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Century Gothic';
	    src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/centurygothic.ttf") format("truetype");
	    font-weight: normal;
	    font-style: normal;
	}
	
	@font-face {
	    font-family: 'Karmina';
	    src: url("https://github.com/DBACarvalho/WebSite/blob/dd0ae32e359d3bf8ee67e5f16f89638a54d8709b/Karmina%20Regular.otf");
	    font-weight: normal;
	    font-style: normal;
	}

        /* Fallback fonts (Remove if custom fonts are hosted correctly) */
        body, html {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 20px;
        }

        body {
            max-width: 100%;
            margin: auto;
            text-align: center;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/BackGround.jpg?raw=true");
            color: black;
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        label {
		display:none;
	      }

        #layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            height: 50px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            background-image: url("https://github.com/DBACarvalho/WebSite/blob/main/PuratosUnicorn_RedRGB1600x1600.png?raw=true");
            margin-bottom: 20px;
        }

       

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid black;
            font-weight: bold;
            text-align: center;
        }

               #api {
            width: 300px;
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #forgotPassword {
	    display: block;!important
	    margin-top: 20px;!important
	    text-align: center;
	    font-weight: bold;
	    color: rgb(209, 0, 52);
	}

        #next {
            padding: 10px;
            width: 95%;
            color: white;
            font-weight: bold;
            background-color: rgb(209, 0, 52);
            margin-top: 10px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
        }


        @media only screen and (max-height: 400px) {
            #logo {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="layer">
        <div id="logo"></div>
        <div id="api">
            <div class="entry-item">
                <input type="password" id="password" placeholder="Password">
            </div>
            <a id="forgotPassword" href="#">Forgot your password?</a>
            <button id="next">Sign In</button>
        </div>
    </div>
</body>
</html>
